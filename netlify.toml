# Netlify config for the CareerGenie frontend (static build).
# No app code changes: the frontend still calls "/api"; this file proxies those
# calls to the Render backend, and serves the SPA for all other routes.

[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# Proxy API calls to the backend on Render.
# >>> After you deploy the backend, replace the host below with your real URL. <<<
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback: every other path serves index.html so React Router works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
